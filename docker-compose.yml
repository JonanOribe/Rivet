services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres_vector_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip_password
      POSTGRES_DB: lingua_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d lingua_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    container_name: paperclip_orchestrator
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://paperclip:paperclip_password@postgres:5432/lingua_db
      - OLLAMA_HOST=http://host.docker.internal:11434
      - PORT=3000
      - SERVE_UI=true
      - PAPERCLIP_DEPLOYMENT_MODE=development
      - BETTER_AUTH_SECRET=8cab117f53a4b69f9159ace54d257f57cb736dac9b6c754878f2a0218bff119d
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata: